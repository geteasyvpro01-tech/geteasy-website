<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetEasy Secure Checkout</title>
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <style>
        body { background-color: #0A0A0A; color: #FFD700; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; flex-direction: column; text-align: center; }
        .loader { border: 5px solid #1A1A1A; border-top: 5px solid #FFD700; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { margin-bottom: 10px; }
        p { color: #888888; font-size: 14px; margin-bottom: 20px;}
        .btn { background: #FFD700; color: #000; padding: 15px 30px; text-decoration: none; font-weight: bold; border-radius: 10px; display: none; font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="loader" id="loader"></div>
    <h2 id="statusText">Connecting to Secure Gateway...</h2>
    <p id="subText">Please do not close this window.</p>
    
    <!-- 🔥 NAYA BUTTON: Agar auto-redirect na ho toh user isko dabaye -->
    <a href="#" id="openAppBtn" class="btn">Open GetEasy App</a>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');
        const orderId = urlParams.get('order_id');

        if (sessionId) {
            const cashfree = Cashfree({ mode: "production" });
            cashfree.checkout({
                paymentSessionId: sessionId,
                redirectTarget: "_self" 
            }).then(result => {
                if (result.error) { showError(); }
            });
        } else if (orderId) {
            document.getElementById("loader").style.display = "block";
            document.getElementById("statusText").innerText = "Payment Successful!";
            document.getElementById("statusText").style.color = "#22C55E";
            document.getElementById("subText").innerText = "Opening GetEasy App...";
            
            // 🔥 TIMER: 3 second baad button dikhega aur auto-redirect try karega
            let count = 3;
            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    document.getElementById("subText").innerText = `Opening app in ${count} seconds...`;
                } else {
                    clearInterval(timer);
                    document.getElementById("loader").style.display = "none";
                    document.getElementById("subText").innerText = "If the app doesn't open automatically, click below:";
                    
                    // Button show karo
                    const btn = document.getElementById("openAppBtn");
                    btn.style.display = "inline-block";
                    btn.href = "geteasy://payment_success?order_id=" + orderId;
                    
                    // Khud se app open karne ki koshish karo
                    window.location.href = btn.href;
                }
            }, 1000);
        } else {
            showError();
        }

        function showError() {
            document.getElementById("loader").style.display = "none";
            document.getElementById("statusText").innerText = "Invalid Request";
            document.getElementById("statusText").style.color = "#EF4444";
            document.getElementById("subText").innerText = "Payment Session missing.";
        }
    </script>
</body>
