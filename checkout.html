<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetEasy Checkout</title>
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <style>
        body { background-color: #0A0A0A; color: #FFD700; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; flex-direction: column; }
        .loader { border: 4px solid #1A1A1A; border-top: 4px solid #FFD700; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>Processing Payment...</h2>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');

        if (sessionId) {
            const cashfree = Cashfree({ mode: "production" });
            
            // 🔥 JS SDK ka use karke check karo ki payment hua ya nahi
            cashfree.checkout({
                paymentSessionId: sessionId,
                redirectTarget: "_self" // Page reload hoga
            }).then(result => {
                if (result.error) {
                    // Payment Cancel ya Fail hua
                    document.body.innerHTML = "<h2 style='color: red;'>Payment Cancelled/Failed</h2><p>You can close this window.</p>";
                } else if (result.paymentDetails) {
                    // Payment Success!
                    document.body.innerHTML = "<h2 style='color: #22C55E;'>Payment Successful! ✅</h2><p>Redirecting to App...</p>";
                    // App ko deep link bhejo
                    window.location.href = "geteasy://payment_success";
                }
            });
        } else {
            // Agar wapas aane par sessionId nahi hai, matlab success page hai
            // Par humein iska bharosa nahi karna, hum JS SDK se hi confirm karenge
            document.body.innerHTML = "<h2 style='color: red;'>Invalid Session</h2><p>Please try again.</p>";
        }
    </script>
</body>
</html>
