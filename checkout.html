<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetEasy Checkout</title>
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <style>
        body { background-color: #0A0A0A; color: #FFD700; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; flex-direction: column; }
        .loader { border: 4px solid #1A1A1A; border-top: 4px solid #FFD700; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>Processing...</h2>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order_id');
        const sessionId = urlParams.get('session_id');

        if (orderId) {
            // 🔥 Payment Successful! App ko wapas kholo
            document.body.innerHTML = "<h2 style='color: #22C55E;'>Payment Successful! ✅</h2><p>Redirecting to App...</p>";
            window.location.href = "geteasy://payment_success?order_id=" + orderId;
        } else if (sessionId) {
            // Naya Payment Start karo
            const cashfree = Cashfree({ mode: "production" });
            cashfree.checkout({
                paymentSessionId: sessionId,
                redirectTarget: "_self"
            });
        } else {
            document.body.innerHTML = "<h2 style='color: red;'>Invalid Session</h2>";
        }
    </script>
</body>
</html>
