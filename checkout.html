<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GetEasy — Payment</title>
<script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
<style>
  body { background:#0A0A0A; color:#fff; font-family:sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
  .card { background:#141414; padding:30px; border-radius:16px; max-width:400px; width:90%; text-align:center; box-shadow:0 0 40px rgba(255,215,0,0.1); }
  h2 { color:#FFD700; margin:0 0 16px; }
  button { background:#FFD700; color:#000; border:0; padding:14px 24px; border-radius:10px; font-weight:bold; font-size:16px; cursor:pointer; margin-top:20px; width:100%; }
  .msg { color:#aaa; font-size:14px; margin-top:16px; }
</style>
</head>
<body>
<div class="card">
  <h2>GetEasy Premium</h2>
  <div class="msg" id="status">Processing...</div>
  <button id="payBtn" style="display:none;">Pay Now</button>
</div>
<script>
const params    = new URLSearchParams(location.search);
const orderId   = params.get("order_id");
const sessionId = params.get("session_id");
const statusEl  = document.getElementById("status");
const payBtn    = document.getElementById("payBtn");

// 🔥 Ye Deep Link app ke SubscriptionActivity se match karna chahiye
const DEEP_LINK = "geteasy://payment_success"; 

function backToApp() {
  window.location.href = DEEP_LINK + "?order_id=" + orderId;
}

if (!orderId || !sessionId) {
  statusEl.textContent = "Invalid payment link";
} else {
  statusEl.textContent = "Ready to pay";
  payBtn.style.display = "block";
  payBtn.onclick = () => {
    payBtn.style.display = "none";
    statusEl.textContent = "Opening Cashfree...";
    
    // Mode: "production" (Live ke liye) ya "sandbox" (Test ke liye)
    const cashfree = Cashfree({ mode: "production" }); 
    
    cashfree.checkout({
      paymentSessionId: sessionId,
      redirectTarget: "_self"
    }).then((result) => {
      // Payment success ya fail hone par seedha app me bhej do
      // App khud backend se verify kar legi
      statusEl.textContent = "Redirecting to app...";
      backToApp();
    }).catch((error) => {
      // Agar user cancel kar de toh bhi wapas bhej do
      statusEl.textContent = "Payment cancelled. Redirecting...";
      setTimeout(backToApp, 1500);
    });
  };
}
</script>
</body>
</html>
