<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GetEasy Checkout</title>
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
    <style>
        body {
            background-color: #0A0A0A;
            color: #FFD700;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
        }
        .loader {
            border: 4px solid #1A1A1A;
            border-top: 4px solid #FFD700;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>Opening Secure Payment...</h2>
    <p style="color: #888; font-size: 14px;">Please do not close this window.</p>

    <script>
        // URL se Session ID nikaalo
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');

        if (sessionId) {
            // Cashfree Initialize (Production Mode)
            const cashfree = Cashfree({ mode: "production" });
            
            // Checkout Trigger karo
            cashfree.checkout({
                paymentSessionId: sessionId,
                redirectTarget: "_self" // Payment ke baad wapas isi page pe aayega
            });
        } else {
            document.body.innerHTML = "<h2 style='color: red;'>Invalid Payment Session</h2>";
        }
    </script>
</body>
</html>
